[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-dtools"
version = "1.0.0"
description = "A Robot Framework library providing general utilities for test automation"
readme = "README.md"
authors = [
    {name = "Rodolfo Dagum", email = "rodolfo.dagum@gmail.com"}
]
license = {text = "Apache-2.0"}
keywords = ["robotframework", "testing", "automation", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.8"
dependencies = [
    "robotframework>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/rdagum/rodotframework-dtools"
Repository = "https://github.com/rdagum/rodotframework-dtools"
Issues = "https://github.com/rdagum/rodotframework-dtools/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtools*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true