name: Test and Quality Checks

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.12'
        type: string
      os:
        description: 'Operating system to run on'
        required: false
        default: 'ubuntu-latest'
        type: string
      run-mypy:
        description: 'Whether to run mypy type checking'
        required: false
        default: true
        type: boolean
      run-robot-tests:
        description: 'Whether to run Robot Framework tests'
        required: false
        default: false
        type: boolean
      upload-coverage:
        description: 'Whether to upload coverage to Codecov'
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ${{ inputs.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          %APPDATA%\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Type check with mypy
      if: ${{ inputs.run-mypy && inputs.python-version != '3.8' }}
      run: |
        mypy dtools/ --ignore-missing-imports --no-strict-optional --allow-untyped-defs --allow-any-generics --disable-error-code=no-any-return
      continue-on-error: true

    - name: Format check with black
      run: |
        black --check --diff .

    - name: Create reports directory
      run: |
        mkdir -p reports

    - name: Run Python tests with pytest
      run: |
        pytest tests/ --verbose --junit-xml=reports/junit.xml --cov=dtools --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Run Robot Framework tests
      if: ${{ inputs.run-robot-tests }}
      run: |
        robot --outputdir reports/robot tests/test_dtools.robot
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ inputs.os }}-py${{ inputs.python-version }}
        path: |
          reports/
          htmlcov/

    - name: Upload coverage to Codecov
      if: ${{ inputs.upload-coverage }}
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella